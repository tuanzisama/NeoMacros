name: dev

on:
  schedule:
    - cron: "0 3 * * *" # nightly 03:00 UTC
  workflow_dispatch:

jobs:
  nightly:
    name: nightly full verification (26.3 node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@v5

      - name: Build version-independent modules and the 26.3 node
        run: ./gradlew :doc-api:build :ports:build :core:build :engine:build :e2e:build :product:26.3:build --console=plain

      - name: Artifact smoke assertions
        run: bash scripts/smoke-build.sh

      - name: Run version-independent module tests
        run: ./gradlew :doc-api:test :ports:test :core:test :engine:test :e2e:test --console=plain
