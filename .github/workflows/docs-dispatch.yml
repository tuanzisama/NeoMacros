name: docs-dispatch

# The documentation lives in the separate NeoMacros-Docs repository (site
# + generator). When an API-source push lands here, notify that
# repository so it regenerates the API pages from the updated sources.
#
# Requires a fine-grained PAT with Contents: read/write on
# tuanzisama/NeoMacros-Docs stored as the DOCS_DISPATCH_TOKEN secret; the
# step is skipped when the secret is absent (regeneration then happens
# through the docs repository's own workflow_dispatch).
on:
  push:
    branches: [main]
    paths:
      - "core/src/main/java/ink/tuanzi/neomacros/core/api/**"
      - "ports/src/main/java/**"
      - "doc-api/src/main/java/**"
  workflow_dispatch:

concurrency:
  group: docs-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: notify NeoMacros-Docs
    runs-on: ubuntu-latest
    steps:
      - name: Trigger docs regeneration
        env:
          DOCS_DISPATCH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        if: env.DOCS_DISPATCH_TOKEN != ''
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $DOCS_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/tuanzisama/NeoMacros-Docs/dispatches \
            -d '{"event_type":"api-docs"}'
