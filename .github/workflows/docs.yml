name: docs

# Regenerates the API documentation from the current Java sources
# (docs-builder) and commits it when the output differs from the
# committed trees. Vercel deploys the site from the committed content
# through its own Git integration; the project's Ignored Build Step
# skips pushes that carry no site changes, so an API-only push produces
# exactly one deployment (the regenerated docs).
on:
  push:
    branches: [main]
    paths:
      - "core/src/main/java/ink/tuanzi/neomacros/core/api/**"
      - "ports/src/main/java/**"
      - "doc-api/src/main/java/**"
      - "docs/**"
      - "docs-builder/**"
      - "scripts/ci/sync-generated-docs.sh"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-regen
  cancel-in-progress: false

jobs:
  build:
    name: regenerate docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The Gradle daemon runs on the last version (25), which the root
      # build's configuration phase needs (fabric-loom requires JVM 25);
      # docs-builder resolves its Java 17 toolchain from the first.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@v5

      - name: Publish doc-api annotations to the local repository
        run: ./gradlew :doc-api:publishToMavenLocal --console=plain

      - name: Generate API docs from the current sources
        run: ./gradlew -p docs-builder generateApiDocs --console=plain

      - name: Sync generated docs into the site
        run: bash scripts/ci/sync-generated-docs.sh

      # Generation warnings (missing translations, missing @ApiSince) stay
      # inspectable without failing the build.
      - name: Upload generation warnings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-docs-warnings
          path: docs-builder/build/gen/md/api/warnings.txt
          if-no-files-found: ignore

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      - name: Install dependencies
        working-directory: docs/site
        run: npm ci

      # The site build doubles as validation: it fails when the synced
      # trees cannot produce a working site.
      - name: Build site
        working-directory: docs/site
        run: npm run generate

      - name: Commit regenerated docs
        run: |
          git config user.name "neomacros-docs-bot"
          git config user.email "docs-bot@users.noreply.github.com"
          git add docs/site/content docs/site/server/assets
          if git diff --cached --quiet; then
            echo "No drift; the committed docs already match the sources."
          else
            git commit -m "docs(api): regenerate documentation from sources"
            git push
          fi
