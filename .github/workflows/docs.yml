name: docs

# Validates the docs pipeline on every push: regenerates the API pages from
# the current sources (docs-builder), syncs them into the Docus site tree,
# builds the static site, and fails when the committed content has drifted
# from what the pipeline produces. The generated trees are committed, and
# Vercel deploys the site from git through its own integration.
on:
  push:
    branches: [main]
    paths:
      - "core/src/main/java/ink/tuanzi/neomacros/core/api/**"
      - "ports/src/main/java/**"
      - "doc-api/src/main/java/**"
      - "docs/**"
      - "docs-builder/**"
      - "scripts/ci/sync-generated-docs.sh"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: validate docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The Gradle daemon runs on the last version (25), which the root
      # build's configuration phase needs (fabric-loom requires JVM 25);
      # docs-builder resolves its Java 17 toolchain from the first.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@v5

      - name: Publish doc-api annotations to the local repository
        run: ./gradlew :doc-api:publishToMavenLocal --console=plain

      - name: Generate API docs from the current sources
        run: ./gradlew -p docs-builder generateApiDocs --console=plain

      - name: Sync generated docs into the site
        run: bash scripts/ci/sync-generated-docs.sh

      # Generation warnings (missing translations, missing @ApiSince) stay
      # inspectable without failing the build.
      - name: Upload generation warnings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-docs-warnings
          path: docs-builder/build/gen/md/api/warnings.txt
          if-no-files-found: ignore

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      - name: Install dependencies
        working-directory: docs/site
        run: npm ci

      - name: Build site
        working-directory: docs/site
        run: npm run generate

      # The generated API trees and the TypeScript definitions are
      # committed (Vercel builds the site from git without Java), so any
      # pipeline output that differs from the checked-in state means the
      # committed docs are stale.
      - name: Check committed docs are up to date
        run: |
          drift="$(git status --porcelain -- docs/site/content docs/site/server/assets)"
          if [ -n "$drift" ]; then
            echo "$drift"
            echo "::error::Generated docs are stale. Run these locally and commit the result:"
            echo "::error::  ./gradlew :doc-api:publishToMavenLocal"
            echo "::error::  ./gradlew -p docs-builder generateApiDocs"
            echo "::error::  bash scripts/ci/sync-generated-docs.sh"
            exit 1
          fi
