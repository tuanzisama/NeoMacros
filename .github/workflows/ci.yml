name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Lints every workflow in this repository including this one, from the
      # upstream release binary (no third-party action dependency).
      - name: Run actionlint
        run: |
          curl -sSfL -o actionlint.tar.gz             https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

  compile:
    name: compile (all active nodes + version-independent modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Toolchains for the version-independent modules (Java 17) and every
      # product node (Java 21 for the 1.21.6 node, Java 25 for 26.x).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - uses: gradle/actions/setup-gradle@v5

      - name: Build version-independent modules and every active product node
        run: |
          set -o pipefail
          ./gradlew :doc-api:build :ports:build :core:build :engine:build :e2e:build :product:1.21.6:build :product:26.1.2:build :product:26.2:build :product:26.3:build --continue --console=plain 2>&1 | tee build-output.log

      # Surfaces the failing tasks and compiler errors as check-run
      # annotations (readable through the public API without
      # authentication); skipped when everything passes.
      - name: Emit build errors as annotations
        if: failure()
        run: |
          python3 - <<'EOF'
          import re
          txt = open('build-output.log', encoding='utf-8', errors='replace').read()
          lines = txt.splitlines()
          shown = 0
          for i, line in enumerate(lines):
              is_failed_task = re.match(r'^> Task .+ FAILED
          EOF

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@v5

      - name: Run version-independent module tests
        run: ./gradlew :doc-api:test :ports:test :core:test :engine:test :e2e:test --console=plain

      # Surfaces failing tests as check-run annotations (readable through the
      # public API without authentication); skipped when everything passes.
      - name: Emit failing tests as annotations
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, re, html
          reports = sorted(glob.glob('*/build/test-results/test/TEST-*.xml'))
          found = False
          for f in reports:
              txt = open(f, encoding='utf-8', errors='replace').read()
              for m in re.finditer(
                      r'<testcase name="([^"]+)" classname="([^"]+)"[^>]*>\s*'
                      r'<(?:failure|error)[^>]*message="([^"]*)"', txt):
                  found = True
                  cls, name, msg = m.group(2), m.group(1), html.unescape(m.group(3))
                  print(f"::error title={cls}.{name}::{msg[:180]}")
                  break  # first failing case per class is enough
          if not found:
              print("::error::unit job failed without test reports under */build/test-results")
          EOF
, line)
              has_error = (' error: ' in line or '错误' in line
                           or 'AssertionFailedError' in line
                           or 'A problem occurred' in line
                           or '> Compilation failure' in line
                           or 'Test ' in line and line.endswith('FAILED'))
              if is_failed_task or has_error:
                  # failed tasks: show the cause lines that follow; error
                  # lines: show the line itself plus context
                  snippet = ' | '.join(l.strip() for l in lines[i:i+6] if l.strip())
                  print(f'::error title=build::{snippet[:500]}')
                  shown += 1
                  if shown >= 15:
                      break
          if shown == 0:
              tail = ' | '.join(l.strip() for l in lines[-30:] if l.strip())
              print(f'::error title=build tail::{tail[:900]}')
          EOF

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@v5

      - name: Run version-independent module tests
        run: ./gradlew :doc-api:test :ports:test :core:test :engine:test :e2e:test --console=plain

      # Surfaces failing tests as check-run annotations (readable through the
      # public API without authentication); skipped when everything passes.
      - name: Emit failing tests as annotations
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, re, html
          reports = sorted(glob.glob('*/build/test-results/test/TEST-*.xml'))
          found = False
          for f in reports:
              txt = open(f, encoding='utf-8', errors='replace').read()
              for m in re.finditer(
                      r'<testcase name="([^"]+)" classname="([^"]+)"[^>]*>\s*'
                      r'<(?:failure|error)[^>]*message="([^"]*)"', txt):
                  found = True
                  cls, name, msg = m.group(2), m.group(1), html.unescape(m.group(3))
                  print(f"::error title={cls}.{name}::{msg[:180]}")
                  break  # first failing case per class is enough
          if not found:
              print("::error::unit job failed without test reports under */build/test-results")
          EOF
