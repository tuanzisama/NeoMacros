name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Lints every workflow in this repository including this one, from the
      # upstream release binary (no third-party action dependency).
      - name: Run actionlint
        run: |
          curl -sSfL -o actionlint.tar.gz             https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

  compile:
    name: compile (all active nodes + version-independent modules)
    runs-on: ubuntu-latest
    env:
      # Channel-stamped versioning (docs/releasing.md): main pushes land in
      # the dev channel so the archived jars are installable dev builds;
      # PR runs are stamped local and never published.
      RELEASE_CHANNEL: ${{ github.event_name == 'push' && 'dev' || 'local' }}
      BUILD_NUMBER: ${{ github.run_number }}
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      # Toolchains for the version-independent modules (Java 17) and every
      # product node (Java 21 for the 1.21.6 node, Java 25 for 26.x).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - uses: gradle/actions/setup-gradle@v5

      - name: Build version-independent modules and every active product node
        run: |
          set -o pipefail
          ./gradlew :doc-api:build :ports:build :core:build :engine:build :e2e:build :product:1.21.6:build :product:26.1.2:build :product:26.2:build :product:26.3:build --continue --console=plain 2>&1 | tee build-output.log

      # Collects every jar produced by the build (the installable product
      # mods in product/*/build/libs plus the version-independent module
      # jars) as a downloadable run artifact.
      - name: Archive built jars
        uses: actions/upload-artifact@v4
        with:
          name: NeoMacros-Artifacts
          path: |
            product/versions/*/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      # Surfaces the failing tasks and compiler errors as check-run
      # annotations (readable through the public API without
      # authentication); skipped when everything passes.
      - name: Emit build errors as annotations
        if: failure()
        run: |
          python3 - <<'EOF'
          import re
          txt = open('build-output.log', encoding='utf-8', errors='replace').read()
          lines = txt.splitlines()
          shown = 0
          for i, line in enumerate(lines):
              if (re.match(r'^> Task .+ FAILED$', line)
                      or ' error: ' in line
                      or '错误' in line):
                  snippet = ' | '.join(l.strip() for l in lines.slice(i, i + 6).concat(lines.slice(Math.max(0, i - 2), i)).filter(Boolean))
                  print(f'::error title=build::{snippet[:400]}')
                  shown += 1
                  if shown >= 15:
                      break
          if shown == 0:
              tail = ' | '.join(l.strip() for l in lines[-25:] if l.strip())
              print(f'::error title=build tail::{tail[:800]}')
          EOF

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@v5

      - name: Run version-independent module tests
        run: ./gradlew :doc-api:test :ports:test :core:test :engine:test :e2e:test --console=plain

      # Surfaces failing tests as check-run annotations (readable through the
      # public API without authentication); skipped when everything passes.
      - name: Emit failing tests as annotations
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, re, html
          reports = sorted(glob.glob('*/build/test-results/test/TEST-*.xml'))
          found = False
          for f in reports:
              txt = open(f, encoding='utf-8', errors='replace').read()
              for m in re.finditer(
                      r'<testcase name="([^"]+)" classname="([^"]+)"[^>]*>\s*'
                      r'<(?:failure|error)[^>]*message="([^"]*)"', txt):
                  found = True
                  cls, name, msg = m.group(2), m.group(1), html.unescape(m.group(3))
                  print(f"::error title={cls}.{name}::{msg[:180]}")
                  break  # first failing case per class is enough
          if not found:
            print("::error::unit job failed without test reports under */build/test-results")
          EOF

  publish-dev:
    name: publish dev prerelease (rolling tag)
    runs-on: ubuntu-latest
    # Every green main push rolls the "dev" prerelease: delete + recreate so
    # stale assets (older MC nodes) never linger, and the tag URL
    # https://github.com/<repo>/releases/tags/dev stays a stable download
    # entry for update checks.
    needs: [compile, unit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: NeoMacros-Artifacts
          path: downloaded

      # The artifact keeps the versions/<mc>/build/libs tree; flatten the
      # mod jars into one dir for checksums and upload.
      - name: Collect mod jars and checksums
        run: |
          mkdir dist
          find downloaded -name '*.jar' -exec cp {} dist/ \;
          (cd dist && sha256sum *.jar > SHA256SUMS)
          ls -1 dist

      - name: Publish rolling dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --cleanup-tag -y --repo "$GITHUB_REPOSITORY" || true
          gh release create dev \
            --prerelease \
            --title "dev builds" \
            --notes "Rolling dev builds from \`main\` (build ${BUILD_NUMBER}, commit ${GITHUB_SHA:0:7}). Rebuilt on every push; always the newest passing state. See docs/releasing.md for channel semantics." \
            --repo "$GITHUB_REPOSITORY" \
            dist/*

      - name: Dispatch update-manifest to NeoMacros-Docs
        env:
          DOCS_DISPATCH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        if: env.DOCS_DISPATCH_TOKEN != ''
        run: |
          status=$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $DOCS_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/tuanzisama/NeoMacros-Docs/dispatches \
            -d '{"event_type":"update-manifest"}') || true
          echo "dispatch HTTP $status"
          cat /tmp/dispatch-response.txt
          [ "$status" = "204" ] || exit 1
