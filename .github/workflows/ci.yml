name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Lints every workflow in this repository including this one, from the
      # upstream release binary (no third-party action dependency).
      - name: Run actionlint
        run: |
          curl -sSfL -o actionlint.tar.gz             https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

  compile:
    name: compile (all active nodes + version-independent modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Toolchains for the version-independent modules (Java 17) and every
      # product node (Java 21 for the 1.21.6 node, Java 25 for 26.x).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - uses: gradle/actions/setup-gradle@v5

      - name: Build version-independent modules and every active product node
        run: ./gradlew :doc-api:build :ports:build :core:build :engine:build :e2e:build :product:1.21.6:build :product:26.1.2:build :product:26.2:build :product:26.3:build --console=plain

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@v5

      - name: Run version-independent module tests
        run: ./gradlew :doc-api:test :ports:test :core:test :engine:test :e2e:test --console=plain

  documentation:
    name: documentation pipeline (placeholder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Documentation pipeline placeholder
        run: bash scripts/ci/documentation.sh
