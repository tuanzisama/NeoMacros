# Event-script example.
# Event macros declare the events they react to in config.event.on; for each
# occurrence NeoMacros invokes the exported startup(ev) with the event
# payload. Manual subscriptions (events.on / events.onSync / events.waitFor)
# still work alongside the declared ones.
#
# The full event catalog lives in the docs (player:join, chat:receive, tick,
# world:* and more). Names are validated when the macro loads: an unknown
# name is rejected and lists the available events. Cancellable events use
# events.onSync; returning a truthy value cancels the event.
name: hello-world
version: 2.0.0
author: NeoMacros
description: greets you on world join (event example)

config:
  event:
    on: [world:join]
