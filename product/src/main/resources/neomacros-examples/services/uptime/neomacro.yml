# Service-script example.
# Scripts below services/ default to lifecycle: always - pulled up at game
# start and stopped at quit - and can be controlled manually with
# /neomacros service start|stop|restart or the management panel.
# Services suit long-running tasks: monitoring, reminders, polling, etc.
name: uptime
version: 1.0.0
author: NeoMacros
description: reports the session uptime every 5 minutes (service example)
lifecycle: always          # services default to game start; 'world' would
                           # load it on world join instead
