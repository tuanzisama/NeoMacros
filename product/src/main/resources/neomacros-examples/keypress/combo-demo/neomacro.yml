# Combo-keypress example: fires only while CTRL is held, on the exact
# keydown edge (not on release, not on key repeat).
name: combo-demo
version: 1.0.0
author: NeoMacros
description: logs when Ctrl+K is pressed (keydown edge + modifier example)

config:
  keypress:
    on: keydown            # exact press/release edges come from raw keyboard events
    key_code: key.keyboard.k
    modifiers: [ctrl]      # all listed modifiers must be held; extra ones are fine
