# NeoMacros script manifest (place ONE of neomacro.yml / neomacro.json in
# the folder; with both present the priority is yml > json).
#
# Required fields: name / version / author - if any is missing, the folder is
# not loaded and the reason shows up in the management panel and in
# /neomacros errors.
name: hello-key            # unique ID: commands, the trust table and the
                           # enable table are all keyed by it; unique across
                           # all three category directories
version: 1.0.0
author: NeoMacros

# ---- Optional fields (Tampermonkey-style) ----
description: prints a chat line when J is pressed (keypress example)
license: MIT
# homepage: https://example.com
# supportURL: https://example.com/support
# main: index.js            # entry file, index.js by default
# lifecycle: world          # world = on world join (default) / always = at
#                           # game start / manual = explicit start only
# permissions: []           # capabilities to trust: fs / net / command / java

# ---- Keypress-specific ----
key: key.keyboard.j         # default key binding. Changes made in the panel
                            # or via /neomacros keypress bind are stored in
                            # the central binding table and win over this
                            # default. A press invokes the exported
                            # onKey(ev) function of this script.
